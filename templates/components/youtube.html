{% component youtube(id, playlist="", autoplay=true, title="YouTube", cookie=false) %}
<div class="video-embedded">
  <iframe
    src="https://www.youtube{% if not cookie %}-nocookie{% endif %}.com/embed/{{ id }}{% if playlist %}?list={{ playlist }}{% endif %}{% if autoplay %}?autoplay=1{% endif %}"
    class="video-iframe"
    title="{{ title }}"
    webkitallowfullscreen
    mozallowfullscreen
    allowfullscreen>
  </iframe>
</div>
{% endcomponent youtube %}
