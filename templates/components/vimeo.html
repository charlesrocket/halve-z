{% component vimeo(id, autoplay=true, loop=true, noautopause=false, title="Vimeo", cookie=false) %}
<div class="video-embedded">
  <iframe
    src="https://player.vimeo.com/video/{{ id }}?embedded=true{% if autoplay %}&autoplay=1{% endif %}{% if loop %}&loop=1{% endif %}{% if noautopause %}&autopause=0{% endif %}{% if not cookie %}&dnt=1{% endif %}"
    class="video-iframe"
    title="{{ title }}"
    webkitallowfullscreen
    mozallowfullscreen
    allowfullscreen>
  </iframe>
</div>
{% endcomponent vimeo %}
